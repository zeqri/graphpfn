function = "bin.graphpfn.pretrain.main"

[base_config]
seed = 0
amp = true
n_steps = 10000
n_gradient_accumulation_steps = 20
epoch_size = 100
gradient_clipping_norm = 1.0
batch_size = 1
# Warm-start: initialize the graph adapters from the original paper's
# released checkpoint (pretrained on the original single-large-graph
# multi-level-sbm-with-pa prior, exp/graphpfn/pretrain/main/) instead of
# from scratch (zero-init) -- same mechanism as
# multigraph_molecule_valence_bounded_warmstart/. The model's own new
# EdgeDistanceEncoder (model.py) has no counterpart in this checkpoint, so
# it's unaffected by the load (base_checkpoint loading uses strict=False
# and only requires checkpoint keys to exist in the current model, not the
# reverse) and still starts zero-init as usual -- only the topology/
# attention machinery that this checkpoint *does* cover gets warm-started.
# Rationale: the dev/README.md section 10 comparison showed the geometric
# runs' synthetic-accuracy climb lagging multigraph_molecule_valence_bounded
# partly because of a slow *joint* cold start (LR warmup ramping up at the
# same time the zero-init EdgeDistanceEncoder does). Warm-starting the rest
# of the network removes one half of that compounding, so any remaining
# slow start here is attributable to the distance pathway alone.
base_checkpoint = "checkpoints/graphpfn-adapters-1_3.pt"

[base_config.optimizer]
type = "AdamW"
lr = 0.001
weight_decay = 0.1

[base_config.evaluation_data]
n_synthetic_per_gpu = 8
# Stripped from the original: the 8 real GraphLand datasets under data/*
# aren't present in this environment (no data/ directory here), and
# get_real_eval_dataset() would crash on the first evaluation call trying to
# open them. n_synthetic_per_gpu is untouched -- that path samples fresh
# synthetic eval datasets from this same prior and needs no external data, so
# it still gives a real (if synthetic) ICL score every epoch.
real = []

[base_config.prior.sanity_check]
min_features = 4
# See multigraph_molecule_valence_bounded/pretrain.toml for the full
# rationale -- unchanged here, this experiment reuses the same graph
# sampler (just with distances added), so the same realized-train_ratio
# drift applies.
min_train_ratio = 0.05
max_train_ratio = 0.5

[base_config.prior.prior]
_distribution_ = "choice"
_shared_ = true

[[base_config.prior.prior.values]]
_type_ = "graph_then_attributes"

# Same nominal-size rationale as multigraph_molecule_valence_bounded/
# pretrain.toml (n_graphs * base_n_nodes is the real per-dataset size, this
# range only needs to approximate it for the shared n_train_nodes DDP
# invariant -- see that file's longer comment for the full explanation).
[base_config.prior.prior.values.graph.n_nodes]
_distribution_ = "log_uniform_int"
min = 250
max = 1250
_shared_ = true

[base_config.prior.prior.values.graph.avg_degree]
_distribution_ = "mixed_log_uniform"
min_first = 1.5
max_first = 100.0
min_second = 100.0
max_second = 500.0
p_first = 0.5
_shared_ = true

# Same multi-graph / molecule-skeleton structure sampler as
# multigraph_molecule_geometric_bond_order_aware/pretrain.toml, unchanged:
# lib.graphpfn.prior.graphs.molecule_skeleton.sample_molecule_skeleton
# samples a per-edge distance from a QM9-derived per-(element pair, bond
# order) Gaussian (BOND_PRIOR_BY_ORDER) and exposes it as
# graph.edata["distance"].
[base_config.prior.prior.values.graph.sampler]
_distribution_ = "choice"

[[base_config.prior.prior.values.graph.sampler.values]]
_type_ = "multi-graph"
size_jitter = 0.12

[base_config.prior.prior.values.graph.sampler.values.n_graphs]
_distribution_ = "uniform_int"
min = 10
max = 30

[base_config.prior.prior.values.graph.sampler.values.base_n_nodes]
_distribution_ = "log_uniform_int"
min = 15
max = 60

[base_config.prior.prior.values.graph.sampler.values.sub_graph.avg_degree]
_distribution_ = "log_uniform"
min = 1.8
max = 2.6
_runtime_ = true

[base_config.prior.prior.values.graph.sampler.values.sub_graph.sampler]
_distribution_ = "choice"
_runtime_ = true

[[base_config.prior.prior.values.graph.sampler.values.sub_graph.sampler.values]]
_type_ = "molecule-skeleton"
heavy_atom_fraction = 0.42
min_ring_size = 3
max_ring_size = 7
compute_distances = true
bond_order_aware_distances = true

[base_config.prior.prior.values.scm]
_type_ = "gnn"

[base_config.prior.prior.values.scm.base]
_type_ = "mlp"

[base_config.prior.prior.values.scm.base.n_features]
_distribution_ = "uniform_int"
_shared_ = true
min = 4
max = 100

[base_config.prior.prior.values.scm.base.n_causes]
_distribution_ = "meta_trunc_norm_log_scaled"
min_mean = 1
max_mean = 12
min_std = 0.01
max_std = 1.0
lower_bound = 1
round = true

[base_config.prior.prior.values.scm.base.n_layers]
_distribution_ = "meta_trunc_norm_log_scaled"
min_mean = 1
max_mean = 6
min_std = 0.01
max_std = 1.0
lower_bound = 2
round = true

[base_config.prior.prior.values.scm.base.hidden_dim]
_distribution_ = "meta_trunc_norm_log_scaled"
min_mean = 5
max_mean = 130
min_std = 0.01
max_std = 1.0
lower_bound = 4
round = true

[base_config.prior.prior.values.scm.base.activation_type]
_distribution_ = "choice"
values = [
    "tanh",
    "leaky_relu",
    "elu",
    "identity",
    "selu",
    "silu",
    "relu",
    "softplus",
    "relu6",
    "hardtanh",
    "sign",
    "rbf",
    "exp",
    "sqrt_abs",
    "unit_interval_indicator",
    "sine",
    "square",
    "abs",
    "random_fourier",
]

[base_config.prior.prior.values.scm.base.activation_type._runtime_]
_distribution_ = "bernoulli"
p = 0.5

[base_config.prior.prior.values.scm.base.activation_type.weights]
random_fourier = 10.0

[base_config.prior.prior.values.scm.base.causes.strategy]
_distribution_ = "choice"
values = [
    "normal",
    "mixed",
    "uniform",
]

[base_config.prior.prior.values.scm.base.causes.pre_sample_stats]
_distribution_ = "choice"
values = [
    true,
    false,
]

[base_config.prior.prior.values.scm.base.noise.std]
_distribution_ = "meta_trunc_norm_log_scaled"
min_mean = 0.0001
max_mean = 0.3
min_std = 0.01
max_std = 1.0
lower_bound = 0.0
round = false

[base_config.prior.prior.values.scm.base.noise.pre_sample_std]
_distribution_ = "choice"
values = [
    true,
    false,
]

[base_config.prior.prior.values.scm.base.init]
scale_std_by_dropout = true

[base_config.prior.prior.values.scm.base.init.std]
_distribution_ = "meta_trunc_norm_log_scaled"
min_mean = 0.01
max_mean = 10.0
min_std = 0.01
max_std = 1.0
lower_bound = 0.0
round = false

[base_config.prior.prior.values.scm.base.init.block_wise_dropout]
_distribution_ = "choice"
values = [
    true,
    false,
]

[base_config.prior.prior.values.scm.base.init.p_dropout]
_distribution_ = "meta_beta"
scale = 0.9
min = 0.1
max = 5.0

[base_config.prior.prior.values.scm.base.causal.enabled]
_distribution_ = "choice"
values = [
    true,
    false,
]

[base_config.prior.prior.values.scm.base.causal.y_is_effect]
_distribution_ = "choice"
values = [
    true,
    false,
]

[base_config.prior.prior.values.scm.base.causal.in_clique]
_distribution_ = "choice"
values = [
    true,
    false,
]

[base_config.prior.prior.values.scm.base.causal.sort_features]
_distribution_ = "choice"
values = [
    true,
    false,
]

# Two changes relative to multigraph_molecule_geometric_bond_order_aware/
# pretrain.toml (on top of the base_checkpoint warm-start above), both aimed
# at concentrating the training signal on the distance-dependent pathway.
# First, conv_type is no longer a 6-way choice ("gcn"/"sage-mean"/"sage-min"/
# "sage-max"/"gt"/"geometric-rbf", 1/6 each) -- it's pinned to "geometric-rbf" for every
# dataset (a single-value "choice" distribution still goes through
# config.py's _sample_choice, which just always returns index 0 when there's
# only one value, so this needs no new distribution type). Every dataset's
# graph-conv layers therefore use GeometricConv (layers.py), so all
# graph-conv-derived labels/features depend on real bond distance, not just
# ~1/6 of them. Directly answers whether "geometric-rbf" is learnable at
# all when it isn't diluted by the other five conv types, complementing
# multigraph_molecule_geometric_upweighted/ (which only raised its weight
# to 50% rather than pinning it to 100%).
#
# graph_conv_ratio is ALSO pinned (to 1.0, same single-value-"choice" trick
# as conv_type above): with the unpinned 11-way {0.0, 0.1, ..., 1.0} choice,
# MixedGraphLinear (layers.py) would still fall back to a plain per-node
# linear transform for a `1 - graph_conv_ratio` fraction of output features
# at every layer -- and ~1/11 of datasets would land on graph_conv_ratio=0.0,
# i.e. *zero* actual distance-dependence for that dataset despite conv_type
# being "geometric-rbf". Pinning both together means every output feature at
# every layer of every dataset's SCM goes through GeometricConv -- no plain-
# linear fallback survives anywhere, so labels are maximally and uniformly
# distance-dependent across the whole run.
[base_config.prior.prior.values.scm.conv_type]
_distribution_ = "choice"
values = [
    "geometric-rbf",
]

[base_config.prior.prior.values.scm.graph_conv_ratio]
_distribution_ = "choice"
values = [
    1.0,
]

[base_config.prior.prior.values.scm.structural]
lappe_k = 0

[base_config.prior.prior.values.scm.structural.use_degree]
_distribution_ = "choice"
values = [
    true,
    false,
]

[base_config.prior.prior.values.scm.structural.use_pagerank]
_distribution_ = "choice"
values = [
    true,
    false,
]

[base_config.prior.prior.values.task]
multiclass_type = "rank"
p_ordered = 0.2
p_reverse = 0.5

[base_config.prior.prior.values.task._type_]
_distribution_ = "choice"
_shared_ = true
values = [
    "regression",
    "binclass",
    "multiclass",
]

[base_config.prior.prior.values.task.n_classes]
_distribution_ = "uniform_int"
min = 2
max = 10

[base_config.prior.prior.values.task.quantile]
_distribution_ = "uniform"
min = 0.01
max = 0.99

[base_config.prior.prior.values.postprocessing]
p_cat = 0.2
max_categories = 256
permute_features = true
permute_labels = true

[base_config.prior.prior.values.train_ratio]
_distribution_ = "uniform"
min = 0.05
max = 0.5
_shared_ = true

[base_config.sampler]
batch_size = 1
n_workers = 12
prefetch_factor = 24
verbose = true

[base_config.model.edge_head]

[base_config.ema]
decay = 0.98

[base_config.lr_scheduler]
n_warmup_steps = 1000
scheduler = "cosine"

[base_config.ssl.edge]
coef = 0.1
